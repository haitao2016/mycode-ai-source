name: Build MyCode-AI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.18.0'

jobs:
  # Job 1: Build and test extensions
  build-extensions:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libkrb5-dev libxkbfile-dev libx11-dev \
            libxkbcommon-dev libgbm-dev libcups2-dev libgtk-3-dev \
            libnotify4 libnss3-dev libxtst-dev

      - name: Build all extensions
        run: node scripts/build-extensions.js

      - name: Package extensions
        run: node scripts/package-extensions.js

      - name: Run smoke tests
        run: |
          REQUIRED=("mycode-ai-main" "mycode-ai-chat" "mycode-ai-agent" \
            "mycode-ai-completion" "mycode-ai-review" "mycode-ai-search" \
            "mycode-ai-refactor" "mycode-ai-debug" "mycode-ai-theme")
          INSTALLED=$(node -e "const m=require('./dist/extensions/extensions.json');console.log(m.extensions.map(e=>e.name).join(' '))")
          for ext in "${REQUIRED[@]}"; do
            if echo "$INSTALLED" | grep -q "$ext"; then
              echo "✓ $ext"
            else
              echo "✗ $ext MISSING" && exit 1
            fi
          done

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycode-ai-extensions
          path: dist/extensions/

  # Job 2: Compile Code-OSS
  compile-code-oss:
    name: Compile Code-OSS
    runs-on: ubuntu-latest
    needs: build-extensions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libkrb5-dev libxkbfile-dev libx11-dev \
            libxkbcommon-dev libgbm-dev libcups2-dev libgtk-3-dev \
            libnotify4 libnss3-dev libxtst-dev

      - name: Install Code-OSS dependencies
        run: |
          cd code-oss
          npm install
          cd build && npm install && cd ..
          cd extensions && npm install && cd ..

      - name: Inject MyCode-AI extensions
        run: CODE_OSS_DIR=$GITHUB_WORKSPACE/code-oss node scripts/inject-into-code-oss.js

      - name: Compile Code-OSS
        run: |
          cd code-oss
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload compiled output
        uses: actions/upload-artifact@v4
        with:
          name: code-oss-compiled
          path: code-oss/out/

  # Job 3: Package for release
  package-release:
    name: Package Release
    runs-on: ${{ matrix.os }}
    needs: compile-code-oss
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download compiled Code-OSS
        uses: actions/download-artifact@v4
        with:
          name: code-oss-compiled
          path: code-oss/out/

      - name: Download extensions
        uses: actions/download-artifact@v4
        with:
          name: mycode-ai-extensions
          path: dist/extensions/

      - name: Generate release notes
        run: node scripts/build-release.js

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mycode-ai-${{ matrix.target }}
          path: |
            dist/release/
            branding/

  # Job 4: Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: package-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mycode-ai-linux/*
            mycode-ai-macos/*
            mycode-ai-windows/*
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
